<style>
body {
  font-family: Arial, sans-serif;
}


.main-content {
  display: flex;
  justify-content: center; 
  align-items: center;    
  min-height: calc(100vh - 60px); 
}


.container {
  width: 90%;
  max-width: 500px;
  background: #d2d0d0;
  padding: 30px 40px;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  text-align: center;
}

.task-title.completed{
  text-decoration: line-through;
}

.DelButt {
  padding: 10px;
  border: none;
  color: red;
  cursor: pointer;
  transition: all 0.15s ease;
  background-color: #d2d0d0;
}

.DelButt:hover{
  transform: scale(1.1);
}

</style>





<div class="main-content">
  <div class="container">
    <section class="List">
      <h4>Task List</h4>
      <ul class="task-list">
        <li *ngFor="let task of taskService.task; let i = index" class="task-item">
          <input
            type="checkbox"
            class="task-checkbox"
            [(ngModel)]="task.completed"/>
          <span class="task-title" [class.completed]="task.completed">
            {{ task.title }}
          </span>
          <button class="DelButt" (click)="deleteTask(i)">✖</button>
        </li>
      </ul>
    </section>

    <hr />

    <section class="Sum">
      <h4>Summary</h4>
      <p>Total tasks: {{ taskService.task.length }}</p>
      <p>Completed: {{ getCompletedCount() }}</p>
      <p>Remaining: {{ taskService.task.length - getRemainingCount() }} </p>
    </section>
  </div>
</div>
