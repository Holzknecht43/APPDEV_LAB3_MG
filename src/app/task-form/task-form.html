<style>
  body{
    font-family: Arial, sans-serif;
  }
 .main {
    display: flex;
    flex-direction: column; 
    justify-content: center;
    align-items: center;
    min-height: 30vh; 
  }
 
 .form-control{
  padding: 12px 20px;
  font-size: 16px;
  border: 2px solid black;
  border-radius: 10px;
  background-color: #d2d0d0;
 } 

 button{
  padding: 12px 20px;
  background-color: #7bff00;
  color: white;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  transition: all 0.15s ease;
 }

 button:hover {
  background-color: #55ad03;
 }


</style>

<div class="main">
  <div class="content">
    <input
      [(ngModel)]="taskTitle"
      name="taskTitle"
      class="form-control"
      placeholder="What to do.........."
    />
    <button (click)="addTask()">Add Task</button>
  </div>
</div>
