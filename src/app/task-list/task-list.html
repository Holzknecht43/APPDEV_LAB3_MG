<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f7f7f7;
    margin: 0;
    padding: 40px 0;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 600px;
    background: #fff;
    padding: 25px 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    text-align: center;
  }

  .task-list {
    list-style-type: none;
    padding: 0;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .task-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80%;
    max-width: 400px;
    padding: 12px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background-color: #f9f9f9;
    transition: background 0.3s ease;
  }

  .task-item:hover {
    background-color: #f1f1f1;
  }

  .task-checkbox {
    margin-right: 10px;
    cursor: pointer;
    transform: scale(1.2);
  }

  .task-title {
    font-size: 16px;
    font-weight: 400;
    color: #333;
    text-decoration: none;
    transition: color 0.3s ease, text-decoration 0.3s ease;
  }

  .task-title.completed {
    color: #888;
    text-decoration: line-through;
  }

  h4 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 15px;
    color: #333;
  }

  hr {
    width: 60%;
    border: none;
    border-top: 1px solid #ccc;
    margin: 25px auto;
  }

  p {
    font-size: 16px;
    color: #555;
  }
</style>

<div class="container">
  <section class="List">
    <h4>Task List</h4>
    <ul class="task-list">
      <li *ngFor="let task of taskService.task; let i = index" class="task-item">
        <input
          type="checkbox"
          class="task-checkbox"
          [(ngModel)]="task.completed"
        />
        <span class="task-title" [class.completed]="task.completed">
          {{ task.title }}
        </span>
      </li>
    </ul>
  </section>

  <hr />

  <section class="Sum">
    <h4>Summary</h4>
    <p>Total tasks: {{ taskService.task.length }}</p>
    <p>Completed: {{ getCompletedCount() }}</p>
  </section>
</div>
